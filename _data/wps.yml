- id: "WP1"
  title: "Management"
  leader: "CNR"
  months: "M1 - M18"
  description: "Led by CNR, Work Package 1 ensures strong and efficient day-to-day management to meet the objectives related to the initialisation phase within time and budget constraints. Work Package 1 focuses on: providing administrative and financial management of the initialisation phase of the project; enhancing cooperation between partners; enabling work progress; ensuring project reporting, contract management, and assuring compliance with the Commission's reporting requirements. Moreover, this work package refers to the early introduction of skills, systems, resources, and institutions needed for the ERIC operationalisation and will be responsible for defining actions for stakeholder engagement."
- id: "WP2"
  title: "Advancing Research Infrastructure Maturity (Phase 1)"
  leader: "SmartLex"
  months: "M1 - M6"
  description: "Led by SmartLex, Work Package 2 will ensure the legal, financial, operational, and technological readiness required for the submission and subsequent implementation of the SoBigData ERIC. Building on the outcomes of the preparatory phase and the progress achieved in the intervening period, this work package will consolidate all documentation essential for establishing the ERIC's structural and legal foundations. It will cover the development of the consortium's legal statutes, governance framework, core operational policies, and budgeting structures, alongside preparations for the technical readiness needed to deploy services. In addition, Work Package 2 will define the access rules to the Research Infrastructure and establish the plan for technological updates required to introduce and implement the new services defined by Work Package 4. Where possible, the Board of Government Representatives (BGR) may formally approve all the necessary documents, thus enabling the timely Step-1 submission of the ERIC application to the European Commission."
- id: "WP3"
  title: "National Nodes"
  leader: "CNR"
  months: "M1 - M24"
  description: "This work package focuses on the comprehensive management and strategic coordination of the RI node at the national level. It encompasses both operational oversight and strategic alignment with national policies, legal frameworks, and funding mechanisms."
- id: "WP4"
  title: "Advancing Research Infrastructure Maturity (Phase 2)"
  leader: "CNR"
  months: "M7 - M24"
  description: "Led by CNR, this work package aims to ensure effective coordination to support the Board of Government Representatives (BGR) during the consultation phase of the ERIC submission. Furthermore, Work Package 4 is responsible for implementing, deploying, and integrating Research Infrastructure services. It will be responsible for the continuous updates to the technological RI and the relative validation. It serves as a bridge between strategic consultation, operational delivery, and long-term sustainability of services."
- id: "WP5"
  title: "Management Finalisation"
  leader: "CNR"
  months: "M19 - M36"
  description: "Led by CNR, Work Package 5 ensures strong and efficient day-to-day management for the project to meet the objectives related to the finalisation phase within time and budget constraints. Work Package 5 provides administrative and financial management for the project's advancement, assuring compliance with the Commission's reporting requirements."
- id: "WP6"
  title: "Advancing Research Infrastructure Maturity (Phase 3)"
  leader: "CNR"
  months: "M25 - M36"
  description: "This work package is focused on supporting the ESFRI operational phase and the setup and operationalisation of the governance structure for the ERIC. It also oversees the release and the first five years of lifecycle management of Research Infrastructure services, ensuring alignment with governance decisions and user needs."
