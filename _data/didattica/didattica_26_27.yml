- corso: Data-Driven Innovation & Data Storytelling
  crediti: 2
  ore: 22
  area: Big Data for Business
  descrizione: "Il modulo si propone di presentare come i big data possano guidare i processi di innovazione delle aziende e quali siano le best practice per il data journalism e lo storytelling. Dopo una discussione preliminare sugli aspetti chiave che caratterizzano i processi di innovazione aziendale, l'enfasi sulla Data-Driven Innovation sarà posta su strumenti molto pratici come il business model canvas. Il modulo descriverà poi le nuove opportunità di innovazione rese possibili dai recenti progressi nelle tecniche di raccolta ed elaborazione dei big data. Infine, i concetti e i modelli chiave dell'innovazione saranno reinterpretati sfruttando il potenziale dei Big Data per aprire nuove opportunità di business. Questo modulo è basato su attività pratiche e ospiterà la testimonianza di una start-up nel settore big data. Successivamente, gli studenti avranno l'opportunità di esplorare le origini del Data Storytelling e del Data Journalism. Il corso si concentrerà anche sull'importanza di uno storytelling accattivante nella presentazione dei dati attraverso l'esplorazione di casi d'uso reali, per dimostrare l'impiego di una corretta visualizzazione e di uno storytelling coinvolgente."
