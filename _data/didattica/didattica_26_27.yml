- corso: Data-Driven Innovation & Data Storytelling
  crediti: 2
  ore: 22
  area: Big Data for Business
  descrizione: 'The module aims to present how big data could drive companies’ innovation processes and which are the best practices for data journalism and story telling. After a preliminary discussion of the key aspects that characterize companies’ innovation processes, the Data-Driven Innovation emphasis will be placed on very practical tools such as business model canvas. The module will then describe new opportunities of innovation made possible by recent advances in the data collection and data processing techniques for big data. Finally, the key concepts and models of innovation will be re-interpreted by exploiting the potential of Big Data to open new business opportunities. This module is based on hands-on work and will host a testimonial of big data start-up. Then, students will have the opportunity to explore the origin of Data Storytelling and Data Journalism. Indeed, the course will also focus on the importance of compelling storytelling in data presentation by mean of exploration of real use case to demonstrate the use of a correct visualization and an engaging storytelling.'
  anno: 2024-2025
  lingua: ''
  professori: Giulio Ferrigno , Lo Duca Angelica
  tutor: ''
  notions:
