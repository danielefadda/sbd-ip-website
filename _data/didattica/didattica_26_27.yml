- corso: Social Network Analysis
  crediti: 3
  ore: 30
  area: Big Data Mining
  descrizione: "Questo modulo introduce gli studenti alle teorie, ai concetti e alle misure della Social Network Analysis (SNA), il cui scopo è caratterizzare la struttura dei Social Network Online (OSN) su larga scala. Il corso presenta sia lezioni in aula per introdurre i concetti teorici, sia attività pratiche al computer per applicare la teoria su dataset reali su larga scala ottenuti da OSN come Facebook e Twitter. Il corso mira a discutere in particolare come le proprietà strutturali dei social network possano essere analizzate attraverso tecniche SNA, e come queste proprietà possano essere utilizzate per caratterizzare i fenomeni sociali che emergono nella società."
