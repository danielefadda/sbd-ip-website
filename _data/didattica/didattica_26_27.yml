- corso: Artificial Intelligence Methods For Text Analysis And Web Mining
  crediti: 4
  ore: 40
  area: Big Data Mining
  descrizione: "Questo modulo introduce i principali metodi di Intelligenza Artificiale per l'analisi e il text mining di dati testuali, generati principalmente dal web. Verrà posta enfasi sui metodi di text mining applicati a testi provenienti dai social media. Inoltre, il modulo presenta le principali tecniche di analisi dei dati web. Utilizzando come caso di studio il query log di un motore di ricerca reale, gli studenti vengono guidati nello sviluppo di un insieme di metodologie per l'analisi dei dati, finalizzate alla creazione di una base di conoscenza per la costruzione di un sistema di raccomandazione. Successivamente, il corso illustra come le stesse informazioni possano essere utilizzate per ottimizzare il ranking nei servizi Web."
  anno: 2024-2025,2023-2024
  lingua: ''
  professori: Nardini Franco Maria , Trani Salvatore
  tutor: ''
  notions:
  - 'Text Analytics: Proprietà del linguaggio e sua rappresentazione. Analytics su testi: task, metodi, applicazioni. Modelli linguistici: dagli approcci puramente statistici alle soluzioni apprese complesse. Rappresentazioni sparse vs dense con approcci neurali. Sentiment Analysis e classificazione. Sentiment Analysis in Python'
