# Docenti anno 2021-2022
- name: Giuseppe Amato
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: Giuseppe Amato ha ottenuto il Dottoraro di Ricerca in Informatica presso l’università di Dortmund, in Germania, nel 2002. E’ un primo ricercatore presso CNR-ISTI, dove è il responsabile del gruppo di ricerca “Artificial Inttelligence and Multimedia Information Retrieval” (AIMIR - http://aimir.isti.cnr.it/ ). I suoi interessi di ricerca principali sono Intelligenza Artificiale, ricerca di documenti multimediali in base al contenuto, indici per la ricerca scalabile basata sulla similarità, reti di telecamere intelligenti.
  image: /assets/images/docenti/Giuseppe Amato.JPG
- name: Davide Bacciu
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Davide Bacciu è Professore Associato al Dipartimento di Informatica, Università di Pisa. Precedentemente è stato assistente alla ricerca presso l’ARTS Lab della Scuola Superiore Sant’Anna Pisa (2004-2005) e presso il gruppo di Neural Computation di LJMU (2007-2008). Nel 2012 è stato ricercatore in visita presso il Cognitive Robotic Systems laboratory, Orebro Universitet.
  image: /assets/images/docenti/bacciu.jpg
- name: Viola Bachini
  role: ''
  institution: Freelance Journalist
  bio: Ho conseguito il Master Biennale in Comunicazione della Scienza alla Scuola Internazionale Superiore di Studi Avanzati di Trieste e lavoro nell'ambito collaborando con diverse istituzioni. In particolare, scrivo le pagine di scienza e tecnologia di diverse riviste nazionali, tra cui Repubblica e L'Espresso. Sono borsista al KDD Lab (Università di Pisa - Cnr), dove mi occupo della comunicazione del master in Big Data, del corso di laurea in Business Informatics e delle attività di laboratorio.
  image: /assets/images/docenti/Bachini1.jpg
- name: Fabio Carrara
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: Fabio Carrara ha ottenuto il Dottorato in Computer Engineering presso l’università di Pisa nel 2019. È ricercatore presso l’Artificial Intelligence for Multimedia and Humanities Laboratory (AIMH, http://aimh.isti.cnr.it/ ) dell’istituto ISTI-CNR.
  image: /assets/images/docenti/profile_2019.jpeg
- name: Martina Cinquini
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Martina Cinquini ha conseguito nel 2021 la laurea specialistica in Data Science and Business Informatics con la tesi intitolata “Boosting Synthetic Data Generation with Effective Nonlinear Causal Discovery”. Attualmente è dottoranda in Computer Science presso l’Università di Pisa. I suoi interessi di ricerca riguardano principalmente la causalità e l’explainable AI.
  image: /assets/images/docenti/CinquiniM.jpeg
- name: Salvatore Citraro
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Salvatore Citraro è un dottorando in Informatica dell'Università di Pisa e membro del KDD-Lab. I suoi temi di ricerca vertono sullo sviluppo e l'analisi di algoritmi e misure su modelli "feature-rich" per reti complesse e sull'applicazione di tali modelli nello studio di fenomeni sociali/cognitivi complessi, dalla formazione di comunità e omofilia nei social network alla caratterizzazione di strutture nascoste nei modelli di lessico mentale basati su reti complesse.
  image: /assets/images/docenti/citraro.jpeg
- name: Giovanni Comandè
  role: ''
  institution: Scuola Superiore Sant'Anna
  bio: Giovanni Comandè (LLM Harvard Law School USA, Ph.D. Scuola Superiore Sant’Anna) è Professore Ordinario di Diritto Privato comparato alla Scuola Superiore Sant’Anna dove ha studiato anche quale allievo ordinario.
  image: /assets/images/docenti/Giovanni-Comandè-300x300.jpg
- name: Andrea Cossu
  role: ''
  institution: Scuola Normale Superiore di Pisa
  bio: Andrea è dottorando in Data Science alla Scuola Normale Superiore e all'Università di Pisa, sotto la supervisione di Davide Bacciu, Vincenzo Lomonaco e Anna Monreale. La sua ricerca ruota intorno al Continual Learning, con applicazioni a reti ricorrenti e dati sequenziali. Andrea è membro del Pervasive AI Lab (Unipi-CNR) e del Computational Intelligence and Machine Learning group (Unipi). È tesoriere e membro del board di ContinualAI, associazione non-profit che riunisce ricercatori e appassionati di continual learning.
  image: /assets/images/docenti/cossua.jpeg
- name: Valentina Cucino
  role: ''
  institution: Scuola Superiore Sant'Anna
  bio: Valentina Cucino è post-doc di ricerca presso la Scuola Superiore Sant'Anna, Pisa. Ha conseguito il dottorato di ricerca in Management Innovation, Sustainability and Healthcare presso la Scuola Superiore Sant’Annain 2019. I suoi interessi di ricerca riguardano il trasferimento tecnologico, la creazione d'impresa e la gestione delle risorse umane.
  image: /assets/images/docenti/Cucino Valentina_BN.jpg
- name: Luca De Biase
  role: ''
  institution: Il Sole 24 Ore
  bio: Laureato all’Università Bocconi di Milano, in Discipline economiche e sociali, con la votazione di 110/110 e lode. E' editor di innovazione al Sole 24 Ore e Nova24 (del quale è stato fondatore, che ha guidato dall’ottobre2005 al giugno 2011; e che ha ripreso a guidare dal luglio 2013) e della Vita Nòva, magazine per tablet. E' docente al master di comunicazione della scienza all’Università di Padova e membro del comitato scientifico del master di comunicazione della scienza alla Sissa di Trieste e del master in Big data analytics della Luiss di Roma.
  image: /assets/images/docenti/debiase.png
- name: Nicola Del Sarto
  role: ''
  institution: Scuola Superiore Sant'Anna
  bio: Nicola Del Sarto è assegnista presso la Scuola Superiore Sant'Anna di Pisa. Ha conseguito un dottorato di ricerca in Management presso la Scuola Superiore Sant'Anna nel 2019. Gli interessi di ricerca di Nicola si concentrano su start-up e meccanismi di supporto come incubatori, acceleratori e programmi di accelerazione aziendale. Inoltre, sta studiando i processi di creazione di imprese nell'ambito del paradigma Open Innovation.
  image: /assets/images/docenti/Nicola 150x150.png
- name: Alberto Di Minin
  role: ''
  institution: Scuola Superiore Sant'Anna
  bio: Alberto Di Minin è Professore Associato presso l'Istituto di Management della Scuola Superiore Sant'Anna di Pisa e Reserch Fellow del Berkeley Roundtable on the International Economy. Segue i temi dell'Open Innovation e dello sviluppo dei nuovi modelli di business. I suoi più recenti lavori sono apparsi su California Mgmt. Review, Research Policy e Journal of International Business Studies.
  image: /assets/images/docenti/alberto_web2.jpg
- name: Daniele Fadda
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: Daniele Fadda, nato a Milano 5-10-81, si laurea in Communication Design presso il Laboratorio Density Design del Politecnico di Milano nel 2010. Attualmente svolge la libera professione occupandosi prevalentemente di progetti di promozione e storytelling territoriale (nei comuni di Pisa e Città della Pieve - PG). Si è occupato di rappresentazione visiva di sistemi complessi e di visualizzazione di dati riguardanti soprattutto le infrastrutture per i trasporti e ha collaborato con diversi studi di architettura come consulente per la comunicazione.
  image: /assets/images/docenti/Fadda1.jpg
- name: Tiziano Fagni
  role: Membro del Consiglio
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: Tiziano Fagni è un ricercatore informatico che lavora presso l'ISTI,CNR con interessi di ricerca che coprono i settori del machine learning e del data mining, e principalmente focalizzati su problematiche di NLP applicate in contesti applicativi di text analytics. Sempre in ambito testuale, si interessa anche di problematiche di scalabilità degli algoritmi di machine learning su domini applicativi di tipo BIG DATA e ultimamente anche di tecnologie di deep learning.
  image: /assets/images/docenti/tizy_profilo.jpg
- name: Fabrizio Falchi
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: Fabrizio Falchi è ricercatore del gruppo Artificial Intelligence for Multimedia Information Retrieval parte del NeMIS lab dell'Istituto ISTI del Consiglio Nazionale delle Ricerche. Dottore di Ricerca in Information Engineering (University of Pisa), e in Informatics (Faculty of Informatics of Masaryk University of Brno), ha conseguito anche anche un MBA dalla Scuola Superiore Sant'Anna in Pisa.
  image: /assets/images/docenti/FabrizioFalchi.jpg
- name: Claudio Gennaro
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: Claudio Gennaro è ricercatore presso CNR-ISTI. Ha conseguito la laurea in Ingegneria Elettronica presso l'Università di Pisa nel 1994 e il Master in Information Technology presso il CEFRIEL di Milano. Ha conseguito il dottorato di ricerca in Ingegneria Informatica e Automatica nel 1999 presso il Politecnico di Milano. I suoi interessi principali sono intelligenza artificiale, deep learning, strutture di accesso per il recupero di documenti multimediali, reti di sensori wireless, sistemi peer- to-peer, biblioteche digitali, valutazione delle prestazioni e computazione parallela.
  image: /assets/images/docenti/claudio gennaro.png
- name: Fosca Giannotti
  role: Membro del Consiglio
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: 'È dirigente di ricerca del Consiglio Nazionale delle Ricerche (CNR) e dirige con Dino Pedreschi il KDD LAB – Knowledge Discovery and Data Mining Laboratory [kdd.isti.cnr.it] – un centro di ricerca congiunto fra l’Università di Pisa e l’Istituto di Scienza e Tecnologie dell’Informazione del CNR, uno dei primi focalizzati sul “data mining”. I suoi interessi di ricerca includono: data mining query languages, knowledge discovery support environment, web-mining, spatio-temporal reasoning, spatio-temporal data mining e privacy preserving data mining.'
  image: /assets/images/docenti/Giannotti1-2-2.jpg
- name: Riccardo Guidotti
  role: Vice Direttore
  institution: Dipartimento d'Informatica, Università di Pisa
  bio: 'Riccardo Guidotti è nato nel 1988 a Pitigliano (GR) Italia. Si è laureato con lode in Informatica nel 2013, presso l''Università di Pisa. La sua tesi di laurea si intitola "Mobility Ranking: Human Mobility Analysis using Ranking Measures". Ha iniziato il dottorato di ricerca in Computer Science presso la Scuola per Graduate Studies "Galileo Galilei", (Università di Pisa), nel novembre 2013. Attualmente è membro del Knowledge Discovery and Data Mining Laboratory.'
  image: /assets/images/docenti/Guidotti1.jpg
- name: Giulia Livieri
  role: ''
  institution: Scuola Normale Superiore di Pisa
  bio: Giulia ha ricevuto la laurea specialistica in Matematica presso l'Università degli studi di Padova con la votazione 110/110. Dopo aver ottenuto il Corso di Alta Formazione in Finanza Matematica presso l'Università di Bologna con la votazione 30/30 Lode, ha ottenuto il Ph.D. in Matematica per la Finanza presso la Scuola Normale Superiore di Pisa nell Ottobre 2017 con la votazione di 70/70 Lode. Attualmente è postdoc alla Scuola Normale Superiore di Pisa.
  image: /assets/images/docenti/Livieri.png
- name: Angelica Lo Duca
  role: ''
  institution: Istituto di Informatica e Telematica, CNR
  bio: Angelica Lo Duca lavora come post-doc presso l’Istituto di Informatica e Telematica del CNR di Pisa. Ha conseguito la laurea magistrale in Ingegneria informatica nel 2007 e il dottorato di ricerca in Ingegneria dell’Informazione nel 2012, entrambi presso l’università di Pisa. Attualmente è membro del laboratorio WAFI (Web Applications for the Future Internet), nel gruppo di Data Visualization e Semantic Web. I suoi interessi di ricerca includono Semantic Web, Data Integration, Data Science e Data Security, applicati ai campi del turismo e dei Beni Culturali.
  image: /assets/images/docenti/angelica.loduca.jpg
- name: Lorenzo Mannocci
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Lorenzo Mannocci si è laureato nel 2019 in Ingegneria Informatica presso l'Università di Pisa, ha poi studiato Data Science and Business Informatics sempre presso l'Università di Pisa, laureandosi nel 2021 con lode con una tesi dal titolo "Bot detection with unsupervised approach based on multivariate time series", svolta in collaborazione con Aristotle University of Thessaloniki.
  image: /assets/images/docenti/MannocciL.jpeg
- name: Andrea Marchetti
  role: ''
  institution: Istituto di Informatica e Telematica, CNR
  bio: È un tecnologo presso l’Istituto di Informatica e Telematica (IIT) del CNR di Pisa. Dal 2009 al 2012 è stato responsabile del laboratorio “Web Applications for the Future Internet” ed è attualmente responsabile dell’attività “Social e Semantic Web”. I suoi principali interessi scientifici riguardano le tematiche Web of Data, (Linked Open Data, Deep Web), Digital Humanities, Social Media Analysis e Data Journalism su cui ha prodotto diverse pubblicazioni.
  image: /assets/images/docenti/marchetti.png
- name: Giovanni Mauro
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Giovanni Mauro è nato a Catanzaro (CZ) nel 1995. Riceve il BSc in Informatica presso l’Università di Pisa (con Erasmus+ di un anno presso la Universidad Autónoma de Madrid) nel 2019 e il MSc in Data Science presso la Universitat Politècnica de Catalunya - BarcelonaTech nel 2021. Prima di unirsi al Dottorato Nazionale in Intelligenza Artificiale ha lavorato come Data Engineer presso privati e ha cooperato con il KDD-Lab dell’IST-CNR per progetti riguardanti Sport Analytics e Human Mobility Analysis.
  image: /assets/images/docenti/maurog.jpg
- name: Michele Mazza
  role: ''
  institution: Istituto di Informatica e Telematica, CNR
  bio: 'Michele è un dottorando membro dell''unità di ricerca in Cyber Intelligence dell''IIT-CNR. La sua ricerca è legata alle Information/Influence Operations che implicano i cosìdetti "coordinated inauthentic behavior" compiuti da account fake sui social network. Michele utilizza tecniche e algoritmi mutuati da diversi campi: social media intelligence, machine learning, deep learning e social network analysis.'
  image: /assets/images/docenti/mazzam.jpeg
- name: Letizia Milli
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Letizia Milli si è laureta in Informatica nel 2013. Attualmente è una studentessa di dottorato al Dipartimento di Informatica dell'Università di Pisa ed è uno dei membri del KDD-LAB, un laboratorio congiunto dell'Università di Pisa e dell'ISTI-CNR di Pisa. I suoi interessi di ricerca sono legati allo studio dei fenomeni diffusivi su reti complesse, alla scieza del successo e al problema della quantificazione.
  image: /assets/images/docenti/Milli1.jpg
- name: Anna Monreale
  role: Direttore
  institution: Dipartimento di Informatica, Università di Pisa
  bio: È Professore Associato presso il Dipartimento di Informatica dell'Università di Pisa e membro del Knowledge Discovery and Data Mining Laboratory (KDD-Lab), un centro di ricerca congiunto tra ISTI-CNR e Università di Pisa. I suoi temi di ricerca includono lo studio della big data analytics, delle social networks e dei problemi di privacy che possono sorgere durante l'analisi di dati personali e sensibili. Ha partecipato a diversi progetti di ricerca europei, tra cui il più recente PETRA, il cui tema principale è la mobilità in ambito "smart cities".
  image: /assets/images/docenti/Monreale1.jpeg
- name: Vinicius Monteiro de Lira
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: Postdoc al High Performance Computing Lab al ISTI-CNR. Ha un dottorato di ricerca in Informatica preso all'Università Federale di Pernambuco in cotutela con l'Università di Pisa. Attuali argomenti di ricerca includono tecniche di Machine Learning applicate a dati di mobilità per lo sviluppo di applicazioni di Smart Mobility. Ha partecipato attivamente a diversi progetti di ricerca europei che coinvolgono diverse aree dell'informatica come Data Mining, Distributed Computing, e Cloud Computing.
  image: /assets/images/docenti/vinicius monteiro de lira.jpg
- name: Mirco Nanni
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: È ricercatore presso l'istituto ISTI del CNR, Pisa. Ha una laurea in Scienze dell'informazione (1996) ed un dottorato di ricerca in Informatica (2001) ottenuti presso l'università di Pisa. I suoi temi di ricerca includono il data mining in generale, metodi di clustering, mobility data analysis e le loro applicazioni. Ha partecipato a numerosi progetti nazionali ed internazionali, tra cui il più recente PETRA, progetto europeo incentrato sul tema della mobilità in ambito "smart cities". E' stato visiting researcher presso vari istituti internazionali, tra cui l'M.I.T.
  image: /assets/images/docenti/nanni.png
- name: Valentina Pansanella
  role: ''
  institution: Scuola Normale Superiore di Pisa
  bio: Valentina Pansanella was born in 1995 in Perugia, Italy. In July 2020 she graduated magna cum laude in Data Science and Business Informatics at University of Pisa with a thesis on Opinion Dynamics on evolving networks and higher order structures. She previously graduated (bachelor degree) magna cum laude in business economics at University of Perugia with a thesis on assets pricing. She's currently a Ph.D. fellow in Data Science in the joint program offered by Scuola Normale Superiore, Scuola Superiore Sant'Anna, University of Pisa, IMT Lucca and National Research Council.
  image: /assets/images/docenti/pansanella.jpeg
- name: Luca Pappalardo
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: 'Ha conseguito la laurea specialistica in Informatica all''Università di Salerno e il dottorato di ricerca in Informatica all''Università di Pisa, con la tesi "Human Mobility, Social Networks and Economic Development: a Data Science perspective".'
  image: /assets/images/docenti/Pappalardo1.jpg
- name: Andrea Passarella
  role: Membro del Consiglio
  institution: Istituto di Informatica e Telematica, CNR
  bio: È Ricercatore presso l'Istituto di Informatica e Telematica del CNR. Si occupa di reti mobili e di Online e Mobile Social Networks, con enfasi sullo studio delle strutture sociali umane in Online Social Networks tramite l'analisi di dati su interazione tra utenti. È co-autore di più di 100 pubblicazioni su riviste e congressi internazionali, ed ha ricevuto diversi riconoscimenti, tra cui 4 Best Paper Awards a congressi internazionali. È stato ed è tuttora coordinatore di gruppi di ricerca CNR in progetti finanziati dalla Commissione Europea.
  image: /assets/images/docenti/passarella.png
- name: Dino Pedreschi
  role: Membro del Consiglio
  institution: Dipartimento di Informatica, Università di Pisa
  bio: È professore ordinario di Informatica all’Università di Pisa ed un pioniere della big data analytics, ovvero l’analisi delle tracce digitali delle attività umane per comprendere la complessità sociale. Dirige con Fosca Giannotti il KDD LAB – Knowledge Discovery and Data Mining Laboratory [kdd.isti.cnr.it] – un centro di ricerca congiunto fra l’Università di Pisa e l’Istituto di Scienza e Tecnologie dell’Informazione del CNR, uno dei primi focalizzati sul “data mining”.
  image: /assets/images/docenti/pedreschi.png
- name: Roberto Pellungrini
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Nato e cresciuto a Viareggio, Toscana, Roberto Pellungrini è dottorando in Informatica presso l’Università di Pisa. I suoi interessi principali di ricerca riguardano gli aspetti etici legati al mondo della Scienza dei Dati, in particolare le problematiche relative alla Privacy degli individui. Prima di vincere la borsa di Dottorato, ha conseguito la Laurea Magistrale in Informatica per l’Economia e L’Azienda, con tesi sulla Valutazione del Rischio di Privacy e della Qualità dei Dati di Mobilità Umana.
  image: /assets/images/docenti/Pellungrini1.jpg
- name: Andrea Piccaluga
  role: ''
  institution: Scuola Superiore Sant'Anna
  bio: Andrea Piccaluga is the Director of the Institute of Management at Scuola Superiore Sant'Anna ( www.sssup.it ), where he is Professor of Innovation Management. He is also President of Netval ( www.netval.it ), the Italian network of University Technology Transfer Offices.
  image: /assets/images/docenti/foto_Picca_2013_BN-2.jpg
- name: Francesca Pratesi
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Francesca Pratesi si è laureata in Tecnologie Informatiche nel 2013. Attualmente è una studentessa di dottorato al Dipartimento di Informatica dell'Università di Pisa ed è uno dei membri del KDD-LAB, un laboratorio congiunto dell'Università di Pisa e dell'ISTI-CNR di Pisa. I suoi interessi di ricerca sono legati alla privacy dei dati, in particolare quella relativa alle tecniche di data mining e ai dati di mobilità.
  image: /assets/images/docenti/Pratesi1.jpg
- name: Giuseppe Prencipe
  role: Membro del Consiglio
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Giuseppe Prencipe è attualmente Professore Associato presso il Dipartimento di Informatica dell'Università di Pisa. I suoi interessi di ricerca vertono su sistemi distribuiti, mobile e wearable computing; ha al suo attivo oltre 50 pubblicazioni scientifiche su riviste e atti di conferenza internazionali, e ha partecipato a numerosi progetti di ricerca nazionali e internazionali. Ha contribuito alla progettazione e allo sviluppo di soluzioni software dedicate ad ambienti distribuiti popolati da robot mobili, e ha sviluppato applicazioni mobili su piattaforme Android, Android Wear e iOS.
  image: /assets/images/docenti/Foto.JPG
- name: Cosimo Rulli
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Cosimo Rulli is a Ph.D student in Computer Science at the University of Pisa and a researcher with the National Research Council of Italy. He received the Master Degree in Computer Engineering from the University of Florence in 2019, with a thesis on deep neural network compression with knowledge distillation and pruning. His research interests focus on deep learning, model compression, and information retrieval.
  image: /assets/images/docenti/cosimo-rulli.png
- name: Cosimo Rulli
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Cosimo Rulli è uno studente di Dottorato in Informatica dell’Università di Pisa e un ricercatore al Consiglio Nazionale delle Ricerche. Ha ottenuto la laurea magistrale in Ingegneria Informatica all’Università di Firenze nel 2019, con una tesi sulla compressione delle Deep Neural Networks mediante l’uso di distillation e pruning. I suoi interessi di ricerca si concentrano su deep learning, model compression e information retrieval.
  image: /assets/images/docenti/cosimo-rulli.png
- name: Roberto Santoro
  role: ''
  institution: Spazio Dati
  bio: 'As graduate researcher at the university of Pisa, Roberto worked initially on algorithms for similarity measures and classification on knowledge graphs (Google Research Award), and later on algorithms for economic networks. He then moved into industry: in Spaziodati he works both on the development of semantic annotation engines and on data science/machine learning projects applied to large economic and textual datasets. In SpazioDati he is also in charge of the SmartDataLake EU project.'
  image: /assets/images/docenti/Santoro.jpg
- name: Roberto Santoro
  role: ''
  institution: Spazio Dati
  bio: In qualità di borsista presso l'università di Pisa, Roberto ha lavorato inizialmente ad algoritmi per misure di similarità e classificazione su grafi di conoscenza (Google Research Award), e in seguito ad algoritmi per reti economiche. Successivamente si è trasferito in SpazioDati, azienda presso la quale si occupa sia dello sviluppo di motori di annotazione semantica, sia di progetti di data science e machine learning applicati a grandi quantità di dati economici e testuali. È responsabile in SpazioDati del progetto europeo SmartDataLake.
  image: /assets/images/docenti/Santoro.jpg
- name: Alina Sîrbu
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Alina Sîrbu is Assistant Professor of Computer Science at the university of Pisa and a member of the KDD LAB. She holds a PhD in Computer Science (2011) from Dublin City University in Ireland. After her PhD she was a postdoctoral researcher at the Institute for Scientific Interchange in Turin, Italy, and at the University of Bologna, Italy. In 2014 she was Visiting Assistant Professor of Computer Science at New York University Shanghai, and in 2017 Visiting Assistant Professor of Computer Science at New York University Abu Dhabi.
  image: /assets/images/docenti/Sirbu1.jpg
- name: Alina Sîrbu
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Alina Sîrbu è ricercatrice del dipartimento di Informatica dell'Università di Pisa e membro del KDD Lab. Ha conseguito il dottorato di ricerca nel 2011 in Informatica in Irlanda (Dublin City University). E' stata postdoc nell'Istituto per l'interscambio scientifico di Torino e assegnista di ricerca all'Università di Bologna. Nel 2014 è stata Visiting Assistant Professor a New York University Shanghai e nel 2017 a New York University Abu Dhabi.
  image: /assets/images/docenti/Sirbu1.jpg
- name: Salvatore Trani
  role: Membro del Consiglio
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: Salvatore Trani ha conseguito la laurea in Informatica presso l'Università di Pisa nel 2013. Intraprende successivamente un periodo di collaborazione con l'Istituto di Scienza e Tecnologie dell'Informazione (ISTI) "A. Faedo" del Consiglio Nazionale delle Ricerche (CNR) di Pisa. Collaborazione che prosegue anche durante i suoi studi presso la scuola di Dottorato di Informatica dell'Università di Pisa.
  image: /assets/images/docenti/DSC01514_0.jpg
- name: Salvatore Trani
  role: Steering Committee Member
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: Salvatore Trani got his master degree at the Computer Science Department of the University of Pisa in 2013. He then started a collaboration with the Istituto di Scienza e Tecnologie dell'Informazione (ISTI) "A. Faedo" of the Consiglio Nazionale delle Ricerche (CNR) in Pisa. The collaboration continued also during his PhD course at the PhD school of Computer Science of the University of Pisa. In 2016 he submitted his PhD thesis titled "Improving Efficiency and Effectiveness of Document Understanding in Web Search". Currently he is a research fellow at ISTI-CNR.
  image: /assets/images/docenti/DSC01514.jpg
- name: Roberto Trasarti
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: 'Si è laureato in Tecnologie Informatiche nel 2006, presso l''Università di Pisa per poi iniziare il dottorato di ricerca in Informatica presso la Scuola "Galileo Galilei", (Università di Pisa). Nel giugno 2010 ha conseguito il dottorato di ricerca presentando la tesi dal titolo “Mastering the Spatio-Temporal Knowledge Discovery Process”. Attualmente è ricercatore del ISTI-CNR, e membro del KDD Lab (Knowledge Discovery and Delivery). I suoi temi di ricerca sono: data mining, analisi dei dati di mobilità, intelligenza artificiale, ragionamento automatico.'
  image: /assets/images/docenti/trasarti.png
- name: Roberto Trasarti
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: 'Roberto Trasarti was born in 1979 in Italy. He graduated in Computer Science in 2006, at the University of Pisa. He discussed his thesis on ConQueSt: a Constraint-based Query System aimed at supporting frequent patterns discovery. He started the Ph.D. in Computer Science at the School for Graduate Studies "Galileo Galilei", (University of Pisa). In June 2010 he received his Ph.D. presenting the thesis entitled "Mastering the Spatio-Temporal Knowledge Discovery Process".'
  image: /assets/images/docenti/trasarti.png
