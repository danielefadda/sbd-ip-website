# Docenti anno 2016-2017
- name: Viola Bachini
  role: ''
  institution: Freelance Journalist
  bio: Ho conseguito il Master Biennale in Comunicazione della Scienza alla Scuola Internazionale Superiore di Studi Avanzati di Trieste e lavoro nell'ambito collaborando con diverse istituzioni. In particolare, scrivo le pagine di scienza e tecnologia di diverse riviste nazionali, tra cui Repubblica e L'Espresso. Sono borsista al KDD Lab (Università di Pisa - Cnr), dove mi occupo della comunicazione del master in Big Data, del corso di laurea in Business Informatics e delle attività di laboratorio.
  image: /assets/images/docenti/Bachini1.jpg
- name: Alessandro Baroni
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Alessandro Baroni è nato in italia nel 1984 in Italia, possiede una Laurea Magistrale in Business Informatics (Informatica). Attualmente è uno Dottorando in Informatica. La sua ricerca riguarda Data mining ed in particolare studia metodi di scoperta e prevenzione di Segregazione su reti sociali.
  image: /assets/images/docenti/Baroni1.jpg
- name: Elena Casprini
  role: ''
  institution: Scuola Superiore Sant'Anna
  bio: Elena Casprini è Postdoc in Economia e Gestione delle Imprese all’Istituto di Management, Scuola Superiore Sant’Anna. È stata Visiting Ph.D. student presso la Cass Business School (Londra, Regno Unito) e collabora con il Dipartimento di Studi Sociali e Giuridici dell’Università di Siena. È coinvolta in attività didattiche riguardanti la gestione dell’innovazione per corsi di laurea triennali, magistrali e masters. I suoi interessi di ricerca principali riguardano l’innovazione dei modelli di business, l’ open innovation e le aziende familiari.
  image: /assets/images/docenti/Casprini.jpg
- name: Giovanni Comandè
  role: ''
  institution: Scuola Superiore Sant'Anna
  bio: Giovanni Comandè (LLM Harvard Law School USA, Ph.D. Scuola Superiore Sant’Anna) è Professore Ordinario di Diritto Privato comparato alla Scuola Superiore Sant’Anna dove ha studiato anche quale allievo ordinario.
  image: /assets/images/docenti/Giovanni-Comandè-300x300.jpg
- name: Marco Cornolti
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Assegnista di ricerca presso l'Università di Pisa, dove ha conseguito anche la laurea ed il dottorato di ricerca in Informatica. Fa parte del laboratorio di ricerca Advanced Algorithms and Applications (Acube Lab). Ha avuto collaborazioni principalmente con Google, NEC e l'Università di Monaco di Baviera. I suoi interessi di ricerca includono la comprensione del linguaggio naturale, la rappresentazione della semantica dei testi, information retrieval ed information extraction, più tutto ciò che sta nel mezzo.
  image: /assets/images/docenti/0aa7a22.jpg
- name: Stefano Cresci
  role: ''
  institution: Istituto di Informatica e Telematica, CNR
  bio: Stefano ha ricevuto la Laurea Specialistica in Ingegneria Informatica nel 2013 ed un Diploma di Master Universitario di secondo livello in Big Data Analytics and Social Mining nel 2016, dall'Università di Pisa. Attualmente è uno studente iscritto al XXX ciclo della Scuola di Dottorato in Ingegneria dell'Informazione dell'Università di Pisa ed un ricercatore a tempo determinato presso l'Istituto di Informatica e Telematica del CNR di Pisa.
  image: /assets/images/docenti/CresciS-2.png
- name: Luca De Biase
  role: ''
  institution: Il Sole 24 Ore
  bio: Laureato all’Università Bocconi di Milano, in Discipline economiche e sociali, con la votazione di 110/110 e lode. E' editor di innovazione al Sole 24 Ore e Nova24 (del quale è stato fondatore, che ha guidato dall’ottobre2005 al giugno 2011; e che ha ripreso a guidare dal luglio 2013) e della Vita Nòva, magazine per tablet. E' docente al master di comunicazione della scienza all’Università di Padova e membro del comitato scientifico del master di comunicazione della scienza alla Sissa di Trieste e del master in Big data analytics della Luiss di Roma.
  image: /assets/images/docenti/debiase.png
- name: Alberto Di Minin
  role: ''
  institution: Scuola Superiore Sant'Anna
  bio: Alberto Di Minin è Professore Associato presso l'Istituto di Management della Scuola Superiore Sant'Anna di Pisa e Reserch Fellow del Berkeley Roundtable on the International Economy. Segue i temi dell'Open Innovation e dello sviluppo dei nuovi modelli di business. I suoi più recenti lavori sono apparsi su California Mgmt. Review, Research Policy e Journal of International Business Studies.
  image: /assets/images/docenti/alberto_web2.jpg
- name: Andrea Esuli
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: È un informatico e dottore di ricerca in ingegneria dell'informazione. Dal 2011, è un ricercatore dell'Istituto di Scienza e Tecnologie dell'Informazione "A. Faedo" del Consiglio Nazionale delle Ricerche. Svolge la sua ricerca nell'area delle Human Language Technologies, investigando problemi di Text Classification, Information Extraction e Sentiment Analysis. Le sue principali compentenze riguardano lo Statistical Machine Learning e l'Information Retrieval.
  image: /assets/images/docenti/esuli.png
- name: Daniele Fadda
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: Daniele Fadda, nato a Milano 5-10-81, si laurea in Communication Design presso il Laboratorio Density Design del Politecnico di Milano nel 2010. Attualmente svolge la libera professione occupandosi prevalentemente di progetti di promozione e storytelling territoriale (nei comuni di Pisa e Città della Pieve - PG). Si è occupato di rappresentazione visiva di sistemi complessi e di visualizzazione di dati riguardanti soprattutto le infrastrutture per i trasporti e ha collaborato con diversi studi di architettura come consulente per la comunicazione.
  image: /assets/images/docenti/Fadda1.jpg
- name: Davide Gazzè
  role: ''
  institution: Integris S.r.l.
  bio: 'Davide Gazzè è Software Architect presso la Integris S.r.l e si occupa della progettazione e sviluppo di una piattaforma di analisi di Big Data in campo semantico. Nel 2015, ha conseguito un dottorato di ricerca presso la scuola Leonardo da Vinci di Pisa con una tesi dal titolo: “Social Media Monitoring and Analysis: Multi-domain Perspectives”.'
  image: /assets/images/docenti/davidegazze_blurry_full_400x400.png
- name: Fosca Giannotti
  role: Membro del Consiglio
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: 'È dirigente di ricerca del Consiglio Nazionale delle Ricerche (CNR) e dirige con Dino Pedreschi il KDD LAB – Knowledge Discovery and Data Mining Laboratory [kdd.isti.cnr.it] – un centro di ricerca congiunto fra l’Università di Pisa e l’Istituto di Scienza e Tecnologie dell’Informazione del CNR, uno dei primi focalizzati sul “data mining”. I suoi interessi di ricerca includono: data mining query languages, knowledge discovery support environment, web-mining, spatio-temporal reasoning, spatio-temporal data mining e privacy preserving data mining.'
  image: /assets/images/docenti/Giannotti1-2-2.jpg
- name: Riccardo Guidotti
  role: Membro del Consiglio
  institution: Dipartimento d'Informatica, Università di Pisa
  bio: 'Riccardo Guidotti è nato nel 1988 a Pitigliano (GR) Italia. Si è laureato con lode in Informatica nel 2013, presso l''Università di Pisa. La sua tesi di laurea si intitola "Mobility Ranking: Human Mobility Analysis using Ranking Measures". Ha iniziato il dottorato di ricerca in Computer Science presso la Scuola per Graduate Studies "Galileo Galilei", (Università di Pisa), nel novembre 2013. Attualmente è membro del Knowledge Discovery and Data Mining Laboratory.'
  image: /assets/images/docenti/Guidotti1.jpg
- name: Claudio Lucchese
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: Laureato con lode presso Università Ca’ Foscari di Venezia in 2003, ha ricevuto il dottorato presso la stessa università nel 2008, è attualmente ricercatore presso lo I.S.T.I. “A. Faedo” – C.N.R. dal 2007. Le sue principali attività di ricerca riguardano le aree Data Mining, Information Retrieval, Large-Scale Data Processing e Cloud Computing. Ha pubblicato più di 60 articoli in riviste e conferenze internazionali. Insegna corsi di data mining e large scale data processing presso l'Università di Firenze e IMT Alti Studi Lucca.
  image: /assets/images/docenti/lucchese.png
- name: Andrea Marchetti
  role: ''
  institution: Istituto di Informatica e Telematica, CNR
  bio: È un tecnologo presso l’Istituto di Informatica e Telematica (IIT) del CNR di Pisa. Dal 2009 al 2012 è stato responsabile del laboratorio “Web Applications for the Future Internet” ed è attualmente responsabile dell’attività “Social e Semantic Web”. I suoi principali interessi scientifici riguardano le tematiche Web of Data, (Linked Open Data, Deep Web), Digital Humanities, Social Media Analysis e Data Journalism su cui ha prodotto diverse pubblicazioni.
  image: /assets/images/docenti/marchetti.png
- name: Letizia Milli
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Letizia Milli si è laureta in Informatica nel 2013. Attualmente è una studentessa di dottorato al Dipartimento di Informatica dell'Università di Pisa ed è uno dei membri del KDD-LAB, un laboratorio congiunto dell'Università di Pisa e dell'ISTI-CNR di Pisa. I suoi interessi di ricerca sono legati allo studio dei fenomeni diffusivi su reti complesse, alla scieza del successo e al problema della quantificazione.
  image: /assets/images/docenti/Milli1.jpg
- name: Anna Monreale
  role: Vice Direttore
  institution: Dipartimento di Informatica, Università di Pisa
  bio: È ricercatrice presso il Dipartimento di Informatica dell'Università di Pisa e membro del Knowledge Discovery and Data Mining Laboratory (KDD-Lab), un centro di ricerca congiunto tra ISTI-CNR e Università di Pisa. I suoi temi di ricerca includono lo studio della big data analytics, delle social networks e dei problemi di privacy che possono sorgere durante l'analisi di dati personali e sensibili. Ha partecipato a diversi progetti di ricerca europei, tra cui il più recente PETRA, il cui tema principale è la mobilità in ambito "smart cities".
  image: /assets/images/docenti/Monreale.jpeg
- name: Alejandro Moreo Fernández
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: Alejandro Moreo Fernández ha ricevuto il PhD in Computer Sciences and Information Technologies presso l'Università di Granada, in Spagna, nel 2013. È attualmente Postdoc all'Istituto di Scienza e Tecnologie dell'Informazione "A. Faedo" del Consiglio Nazionale delle Ricerche. I suoi interessi di ricerca riguardano il deep learning e representation learning applicato a problemi di imbalanced text classification, multilingual text classification, e cross-domain and cross-lingual sentiment classification.
  image: /assets/images/docenti/MoreoFernandez.jpg
- name: Mirco Nanni
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: È ricercatore presso l'istituto ISTI del CNR, Pisa. Ha una laurea in Scienze dell'informazione (1996) ed un dottorato di ricerca in Informatica (2001) ottenuti presso l'università di Pisa. I suoi temi di ricerca includono il data mining in generale, metodi di clustering, mobility data analysis e le loro applicazioni. Ha partecipato a numerosi progetti nazionali ed internazionali, tra cui il più recente PETRA, progetto europeo incentrato sul tema della mobilità in ambito "smart cities". E' stato visiting researcher presso vari istituti internazionali, tra cui l'M.I.T.
  image: /assets/images/docenti/nanni.png
- name: Andrea Passarella
  role: Membro del Consiglio
  institution: Istituto di Informatica e Telematica, CNR
  bio: È Ricercatore presso l'Istituto di Informatica e Telematica del CNR. Si occupa di reti mobili e di Online e Mobile Social Networks, con enfasi sullo studio delle strutture sociali umane in Online Social Networks tramite l'analisi di dati su interazione tra utenti. È co-autore di più di 100 pubblicazioni su riviste e congressi internazionali, ed ha ricevuto diversi riconoscimenti, tra cui 4 Best Paper Awards a congressi internazionali. È stato ed è tuttora coordinatore di gruppi di ricerca CNR in progetti finanziati dalla Commissione Europea.
  image: /assets/images/docenti/passarella.png
- name: Dino Pedreschi
  role: Direttore
  institution: Dipartimento di Informatica, Università di Pisa
  bio: È professore ordinario di Informatica all’Università di Pisa ed un pioniere della big data analytics, ovvero l’analisi delle tracce digitali delle attività umane per comprendere la complessità sociale. Dirige con Fosca Giannotti il KDD LAB – Knowledge Discovery and Data Mining Laboratory [kdd.isti.cnr.it] – un centro di ricerca congiunto fra l’Università di Pisa e l’Istituto di Scienza e Tecnologie dell’Informazione del CNR, uno dei primi focalizzati sul “data mining”.
  image: /assets/images/docenti/pedreschi.png
- name: Raffaele Perego
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: È primo ricercatore del Consiglio Nazionale delle Ricerche (CNR) e coordinatore del laboratorio High Performance Computing (HPC Lab, http://hpc.isti.cnr.it ) dell"Istituto di Scienza e Tecnologia dell'Informazione A. Faedo" (ISTI), il più grande istituto di ricerca del CNR del settore ICT. Il laboratorio opera nell'Area della Ricerca del CNR di Pisa, ed è strettamente collegato con l'Università di Pisa e l'iniziativa SoBigData Lab.
  image: /assets/images/docenti/perego-2.jpg
- name: Salvatore Pirri
  role: ''
  institution: Scuola Superiore Sant'Anna
  bio: 'Laureato con lode in Economia e Scienze delle Pubbliche Amministrazioni presso l’Università della Calabria. Dal 2016 PhD student presso la Scuola Superiore Sant’Anna di Pisa, dove nel 2015 ottengo il Master di II livello in Management dell’innovazione e ingegneria dei servizi (MAINS). Durante il percorso di studi maturo diverse esperienze di lavoro all’estero e in Italia: Presso l’ambasciata d’Italia a Budapest; Presso l’ENEA a Bruxelles, presso SELEX-ES(Leonardo) a Genova.'
  image: /assets/images/docenti/Pirri.jpg
- name: Francesca Pratesi
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Francesca Pratesi si è laureata in Tecnologie Informatiche nel 2013. Attualmente è una studentessa di dottorato al Dipartimento di Informatica dell'Università di Pisa ed è uno dei membri del KDD-LAB, un laboratorio congiunto dell'Università di Pisa e dell'ISTI-CNR di Pisa. I suoi interessi di ricerca sono legati alla privacy dei dati, in particolare quella relativa alle tecniche di data mining e ai dati di mobilità.
  image: /assets/images/docenti/Pratesi1.jpg
- name: Daniele Regoli
  role: ''
  institution: Scuola Normale Superiore di Pisa
  bio: Daniele Regoli è assegnista post-doc alla Scuola Normale Superiore di Pisa, nel gruppo di Finanza Quantitativa. Ha studiato Fisica, ottenendo la laurea all'Università di Bologna e il dottorato in Cosmologia nella stessa Università nel 2011. Ha lavorato a Padova, nel gruppo di Probabilità del Dipartimento di Matematica e poi alla Scuola Normale. I suoi interessi di ricerca riguardano analisi ed inferenza su reti complesse e le loro applicazioni economico/finanziarie, ed in generale modelli per sistemi complessi.
  image: /assets/images/docenti/Regoli.jpg
- name: Maurizio Tesconi
  role: ''
  institution: Istituto di Informatica e Telematica, CNR
  bio: È un ricercatore dell'Istituto di Informatica e Telematica del CNR di Pisa. Laureato in Ingegneria Informatica, ha ottenuto un dottorato di Ricerca in Ingegneria dell'Informazione con una tesi riguardante lo sviluppo di un framework per la gestione di risorse semantiche complesse. I suoi interessi di ricerca riguardano l'analisi dei Social Media, il Visual Analytics, il Semantic Web e la Linguistica Computazionale. Attualmente insegna 'Visual Analytics' all'interno della laurea magistrale in business informatics dell'università di Pisa.
  image: /assets/images/docenti/tesconi.png
- name: Roberto Trani
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Laureato con lode nel 2016 in Informatica presso l'Università di Pisa (Italia), inizia nello stesso anno il dottorato di ricerca in Informatica presso la stessa università. Roberto è attualmente studente di dottorato e membro del laboratorio High Performance Computing (HPC Lab) presso l'istituto ISTI "A. Faedo" del CNR (Pisa). I suoi principali interessi di ricerca sono Information Retrieval, Machine Learning e Web Mining.
  image: /assets/images/docenti/TraniR.jpg
- name: Salvatore Trani
  role: Membro del Consiglio
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: Salvatore Trani ha conseguito la laurea in Informatica presso l'Università di Pisa nel 2013. Intraprende successivamente un periodo di collaborazione con l'Istituto di Scienza e Tecnologie dell'Informazione (ISTI) "A. Faedo" del Consiglio Nazionale delle Ricerche (CNR) di Pisa. Collaborazione che prosegue anche durante i suoi studi presso la scuola di Dottorato di Informatica dell'Università di Pisa.
  image: /assets/images/docenti/DSC01514_0.jpg
- name: Roberto Trasarti
  role: ''
  institution: Istituto di scienza e tecnologie dell'Informazione, CNR
  bio: 'Si è laureato in Tecnologie Informatiche nel 2006, presso l''Università di Pisa per poi iniziare il dottorato di ricerca in Informatica presso la Scuola "Galileo Galilei", (Università di Pisa). Nel giugno 2010 ha conseguito il dottorato di ricerca presentando la tesi dal titolo “Mastering the Spatio-Temporal Knowledge Discovery Process”. Attualmente è ricercatore del ISTI-CNR, e membro del KDD Lab (Knowledge Discovery and Delivery). I suoi temi di ricerca sono: data mining, analisi dei dati di mobilità, intelligenza artificiale, ragionamento automatico.'
  image: /assets/images/docenti/trasarti.png
- name: Franco Turini
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: 'Laureato con lode in Scienze dell’Informazione all’Università degli Studi di Pisa nel 1973, ha ricoperto all’Università di Pisa i seguenti ruoli: borsista CNR nel ‘73-‘74, contrattista quadriennale nel ‘74-‘78, assistente ordinario nel ‘78-‘82, professore associato nel ‘82-‘87, professore ordinario dal 1987 a oggi.'
  image: /assets/images/docenti/turini.png
- name: Rossano Venturini
  role: ''
  institution: Dipartimento di Informatica, Università di Pisa
  bio: Rossano Venturini è ricercatore presso il Dipartimento di Informatica dell'Università di Pisa. Ha ricevuto il dottorato di ricerca in Informatica presso l'Università di Pisa nel 2010 discutendo la tesi dal titolo "On Searching and Extracting Strings from Compressed Textual Data''. I suoi interessi di ricerca si focalizzano principalmente sullo sviluppo e analisi di algoritmi e strutture dati con particolare interesse ai problemi di indicizzazione e ricerca su grandi collezioni di dati testuali.
  image: /assets/images/docenti/venturini-2.jpeg
