project_management_team:
  - name: "Roberto Trasarti"
    role: "Scientific Coordinator"
    photo: "/assets/images/team/trasarti.png"
    bio: "Roberto Trasarti was born in 1979 in Italy. He graduated in Computer Science in 2006, at the University of Pisa. He discussed his thesis on ConQueSt: a Constraint-based Query System aimed at supporting frequent patterns discovery. He started the Ph.D. in Computer Science at the School for Graduate Studies “Galileo Galilei”, (University of Pisa). In June 2010 he received his Ph.D. presenting the thesis entitled “Mastering the Spatio-Temporal Knowledge Discovery Process”. He is currently a member of ISTI-CNR, and also a member of Knowledge Discovery and Delivery Laboratory. His interests regard Data mining, Spatio-Temporal data analysis, Artificial intelligence, Automatic Reasoning."
  - name: "Valerio Grossi"
    role: "Project Manager"
    photo: "/assets/images/team/grossi.jpeg"
    bio: "Valerio Grossi holds a Ph.D. in Computer Science from the University of Pisa. His research interests focus on the analysis of massive and complex data including mining data streams, ontology-driven mining, business intelligence and knowledge discovery systems. He took part in several European research projects as a member of the UNIPI research group, among which figure BRITE (Business Register Interoperability throughout Europe), MUSING (MUlti-industry, Semantic-based next generation business INtelliGence) and ICON (Inductive Constraint Programming), where he focused on the development of brand new data mining and knowledge discovery applications and on the research for the development of new business intelligence approaches."
  - name: "Michela Natilli"
    role: "Infrastructure Manager"
    photo: "/assets/images/team/natilli.jpeg"
    bio: "Statistician, graduated in Statistics and Economics at University of Siena in 2001. She’s got a master of Science (M.Sc.) from University of Pisa in Big Data Analytics and Social Mining in 2015. Her current research interests are Food Analytics and Gender studies."
  - name: "Pasquale Pagano"
    role: "Technological Leader"
    photo: "/assets/images/team/pagano.png"
    bio: "Pasquale Pagano is a Technological Leader at the Institute of Information Science and Technologies (ISTI) of"
  - name: "Massimiliano Assante"
    role: "Technological Leader"
    photo: "/assets/images/team/assante.jpeg"
    bio: "Massimiliano Assante is a Technological Leader at the Institute of Information Science and Technologies (ISTI) of"
  - name: "Daniele Fadda"
    role: "Communication Manager"
    photo: "/assets/images/team/fadda.jpg"
    bio: "Information designer, graduated in Communication Design at the Politecnico di Milano in 2010. He’s got a master of Science (M.Sc.) from University of Pisa in Big Data Analytics and Social Mining in 2015. His current research interests are Mobility Data Analysis, Data Visualization for complex systems and Visual Analytics methods for Big Data."
