---
layout: default-full
---

<main class="container-lg pb-3 flex-fill">
    <div class="row pt-4">
        <div class="col-12">
            <h1 class="mb-4">{{ page.title }}</h1>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-12">
            <div class="mb-4">
                {{ content }}
            </div>

            <div class="partners-grid">
                {% for partner in site.data.consortium %}
                <a href="{{ partner.url }}" target="_blank" rel="noopener noreferrer" class="partner-item-link">
                    <div class="partner-item partner-{{ partner.role | downcase | replace: " ", "-" }}">
                        <div class="partner-logo-wrapper">
                            <img src="{{ partner.logo | relative_url }}" alt="{{ partner.name }}" class="partner-logo" title="{{ partner.name }}">
                        </div>
                        <div class="partner-info">
                            <p class="partner-name">{{ partner.name }}</p>
                            <span class="partner-badge partner-badge-{{ partner.role | downcase | replace: " ", "-" }}">{{ partner.role }}</span>
                            <span class="partner-badge partner-badge-country">{{ partner.country }}</span>
                        </div>
                    </div>
                </a>
                {% endfor %}
            </div>
        </div>
    </div>
</main>
