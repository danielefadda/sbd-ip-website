{% assign project_header_images = site.static_files | where_exp: "file", "file.path contains '/assets/images/progetti/'" | sort: "name" %}

<section class="projects-header-grid" aria-labelledby="projects-header-grid-title">
  <style>
    .projects-header-grid {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      margin-right: calc(50% - 50vw);
      margin-top: -2rem;
      padding: 3rem 0 2rem;
      background:
        linear-gradient(180deg, rgba(247, 248, 251, 0.98) 0%, rgba(233, 237, 244, 0.96) 100%),
        radial-gradient(circle at top left, rgba(0, 107, 166, 0.08) 0%, transparent 35%);
      overflow: hidden;
    }

    .projects-header-grid__inner {
      width: min(100%, 1600px);
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .projects-header-grid__content {
      max-width: 720px;
      margin: 0 auto 2rem;
      text-align: center;
    }

    .projects-header-grid__eyebrow {
      margin: 0 0 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #0b5f85;
    }

    .projects-header-grid__title {
      margin: 0;
      font-size: clamp(2.4rem, 4vw, 4.4rem);
      line-height: 0.95;
      color: #11283a;
    }

    .projects-header-grid__subtitle {
      margin: 1rem auto 0;
      font-size: 1.05rem;
      line-height: 1.7;
      color: #41505f;
    }

    .projects-header-grid__mosaic {
      display: grid;
      grid-template-columns: repeat(14, minmax(0, 1fr));
      gap: 0.55rem;
    }

    .projects-header-grid__tile {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 0.9rem;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.45);
      box-shadow: 0 16px 40px rgba(17, 40, 58, 0.08);
    }

    .projects-header-grid__tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.02);
    }

    @media (max-width: 1199.98px) {
      .projects-header-grid__mosaic {
        grid-template-columns: repeat(10, minmax(0, 1fr));
      }
    }

    @media (max-width: 991.98px) {
      .projects-header-grid {
        padding-top: 2.5rem;
      }

      .projects-header-grid__mosaic {
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }
    }

    @media (max-width: 575.98px) {
      .projects-header-grid__inner {
        padding: 0 1rem;
      }

      .projects-header-grid__content {
        margin-bottom: 1.5rem;
      }

      .projects-header-grid__mosaic {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.4rem;
      }
    }

    @media (max-width: 767.98px) {
      .projects-header-grid {
        display: none;
      }
    }
  </style>

  <div class="projects-header-grid__inner">
    <div class="projects-header-grid__mosaic" data-projects-grid>
      {% for file in project_header_images limit: 42 %}
      <figure class="projects-header-grid__tile">
        <img src="{{ file.path | relative_url }}" alt="Progetto del Master {{ forloop.index }}" loading="lazy">
      </figure>
      {% endfor %}
    </div>
  </div>

  <script>
    (function() {
      var imagePool = [
        {% for file in project_header_images %}
        {
          url: {{ file.path | relative_url | jsonify }},
          alt: {{ file.name | split: '.' | first | replace: '_', ' ' | replace: '-', ' ' | jsonify }}
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ];
      var mobileBreakpoint = 767.98;
      var grid = document.currentScript.previousElementSibling.querySelector('[data-projects-grid]');

      function shuffle(items) {
        var shuffled = items.slice();

        for (var index = shuffled.length - 1; index > 0; index -= 1) {
          var swapIndex = Math.floor(Math.random() * (index + 1));
          var current = shuffled[index];
          shuffled[index] = shuffled[swapIndex];
          shuffled[swapIndex] = current;
        }

        return shuffled;
      }

      function fillGrid() {
        if (!grid || !imagePool.length) {
          return;
        }

        var viewportWidth = window.innerWidth || document.documentElement.clientWidth;
        var totalTiles = 42;

        if (viewportWidth <= mobileBreakpoint) {
          grid.innerHTML = '';
          return;
        }

        if (viewportWidth <= 991.98) {
          totalTiles = 21;
        } else if (viewportWidth <= 1199.98) {
          totalTiles = 30;
        }

        var selectedImages = [];
        var shuffled = shuffle(imagePool);

        while (selectedImages.length < totalTiles) {
          selectedImages = selectedImages.concat(shuffled);
          shuffled = shuffle(imagePool);
        }

        grid.innerHTML = selectedImages.slice(0, totalTiles).map(function(image, index) {
          return '<figure class="projects-header-grid__tile">'
            + '<img src="' + image.url + '" alt="Progetto del Master ' + (index + 1) + ': ' + image.alt + '" loading="lazy">'
            + '</figure>';
        }).join('');
      }

      fillGrid();
      window.addEventListener('resize', fillGrid);
    })();
  </script>
</section>
