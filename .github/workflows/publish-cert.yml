name: Publish site to cert

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  detect-deploy:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.deploy_check.outputs.should_deploy }}
    steps:
      - name: Check commit messages for deploy marker
        id: deploy_check
        uses: actions/github-script@v7
        with:
          script: |
            const commits = context.payload.commits || [];
            const shouldDeploy = commits.some((commit) => {
              const message = (commit.message || '').toLowerCase();
              return message.includes('deploy');
            });

            core.setOutput('should_deploy', shouldDeploy ? 'true' : 'false');

  build-and-publish:
    needs: detect-deploy
    if: needs.detect-deploy.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Publish to cert branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: cert
          publish_dir: ./_site
          force_orphan: true
          enable_jekyll: false
