# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.

# Site settings
title: "Master in Big Data Analytics & AI for Society"
subtitle: "SoBigData Master - Università di Pisa"
email: masterbigdata@unipi.it
description: >-
  Il Master in Big Data Analytics and Artificial Intelligence for Society dell'Università di Pisa è un percorso annuale per diventare data scientist

markdown: kramdown

# Tema Remoto (Cruciale per scaricare Chulapa)
remote_theme: "dieghernan/chulapa"

# Navigazione
navbar:
  style: dual
  brand:
    title: "Master in Big Data Analytics & AI for Society"
    img: "./assets/images/Logo_masthead.png"
    url: /
  nav:
    - title: Iscrizione
      url: /iscrizione
    - title: Didattica
      url: /didattica
    - title: Partner
      url: /partner
    - title: Progetti
      url: /progetti
    - title: Docenti
      child:
        - title: Corpo Docente
          url: /docenti
        - title: Direttivo
          url: /direttivo
    - title: Studenti
      url: /studenti
    - title: Contatti
      url: /contatti
    - title: Moodle
      url: https://masterbigdata.unipi.it/login/index.php
      target: _blank

# Personalizzazione Aspetto
googlefonts:
  - url: "https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap"
  - url: "https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
  - url: "https://fonts.googleapis.com/css2?family=Lekton:ital,wght@0,400;0,700;1,400&display=swap"

chulapa-skin:
  skin: "graymor"
  vars:
    body-color: "#07286E"
    body-bg: "#fff"
    footer-chulapa-bg-color: "#07286E"
    footer-chulapa-text-color: "#fff"
    navbar-chulapa-bg-color: "#07286E"
    navbar-chulapa-text-color: "#fff"
    primary: "#07286E"
    link-color: "#9b1626"
    link-hover-color: "#de1f36"
    link-decoration: "underline"
    headings-font-family: "Rajdhani"

##################################################
#    Configurazioni di sistema (NON modificare)
##################################################

plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-include-cache
  
collections:
  pages:
    output: true
    permalink: /:path

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: https://www.linkedin.com/company/sobigdata
    - label: "Twitter"
      icon: "fab fa-twitter"
      url: https://www.twitter.com/sobigdata
    - label: "Facebook"
      icon: "fab fa-facebook"
      url: https://www.facebook.com/sobigdata
  copyright: "2026 – SoBigData Master"

sass:
  quiet_deps: true

# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
exclude:
 - .sass-cache/
 - .jekyll-cache/
 - gemfiles/
 - Gemfile
 - Gemfile.lock
 - node_modules/
 - vendor/bundle/
 - vendor/cache/
 - vendor/gems/
 - vendor/ruby/
 - .idea/

include:
  - .nojekyll

livereload: true
baseurl: "/sbd-master-website" 
url: ""